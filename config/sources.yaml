version: 1
# 每个源均采用真实文件复制，不使用 submodule、软链接或 git subtree。
# 上游同步只管理 manifest 中列出的目录；本地说明放在 docs/ 与 catalog/overrides.yaml。
sources:
  - id: photo-to-poster
    repo: GZ-L/photo-to-poster-skills
    ref: main
    kind: collection
    base: skills
    sparse: [skills]
    category: 艺术海报
    license: MIT

  - id: wibi-style
    repo: Vieeeeeee/wibi-style
    ref: main
    kind: collection
    base: skills
    sparse: [skills, assets/thumbs]
    preview_from: assets/thumbs
    category: 创意风格
    license: Wibi Personal Non-Commercial 1.0 + MIT tooling
    notes: 用户表示已获得导入许可；遵守每个 Skill 内的 LICENSE、NOTICE、署名、字体及第三方图片限制；商业使用须独立确认授权。

  - id: image-style-transfer
    repo: jyi06/image-style-transfer
    ref: main
    kind: items
    sparse: [skills]
    items:
      - path: skills/image-style-transfer
        target: image-style-transfer
    category: 风格迁移
    license: MIT

  - id: mono-color
    repo: yanliudesign/mono-color-skill
    ref: main
    kind: root
    target: mono-color
    sparse: [design-system, scripts, swatches]
    include: [SKILL.md, REFERENCES.md, LICENSE, ASSET-LICENSE.md, design-system, scripts, swatches]
    category: 极简印刷
    license: MIT

  - id: paper-signal
    repo: jiahuiqu17/paper-signal
    ref: main
    kind: collection
    base: skills
    sparse: [skills]
    category: 杂志排版
    license: MIT

  - id: minimal-editorial
    repo: SARSfang/photo-to-minimal-form-poster
    ref: main
    kind: root
    target: minimal-editorial-poster
    sparse: [agents, assets, references, scripts]
    include: [SKILL.md, LICENSE, agents, assets, references, scripts]
    category: 极简海报
    license: MIT

  - id: anime-restyle
    repo: gaoren7716-lab/anime-image-restyle-skill
    ref: main
    kind: root
    target: anime-image-restyle
    sparse: [references, scripts]
    include: [SKILL.md, LICENSE, PROTOCOL.md, references, scripts]
    category: 动漫插画
    license: MIT

  - id: muse-retouch
    repo: GuohongLi/muse-skills
    ref: main
    kind: items
    sparse: [portrait-retouch, select-retouch, vcg-retouch]
    items:
      - path: portrait-retouch
        target: portrait-retouch
      - path: select-retouch
        target: select-retouch
      - path: vcg-retouch
        target: vcg-retouch
    category: 真实修图
    license: MIT

  - id: lightroom-computer-use
    repo: eamonboyle/computer-use-photo-editing-skills
    ref: main
    kind: collection
    base: .agents/skills
    sparse: [.agents/skills]
    category: Lightroom 后期
    license: MIT

  - id: photo-editing-craft
    repo: aipiratesMunich/photo-editing-craft
    ref: main
    kind: root
    target: photo-editing-craft
    sparse: [backends, craft, recipes, scripts, tests]
    include: [SKILL.md, LICENSE, backends, craft, recipes, scripts, tests]
    category: 专业修图
    license: MIT

  - id: poster-generator
    repo: howardz27/poster-generator-skill
    ref: main
    kind: root
    target: poster-generator
    sparse: [references]
    include: [SKILL.md, LICENSE, references]
    category: 海报设计
    license: MIT

  # 单独作为「参考配方」保存，原仓库不使用标准 SKILL.md，不能当成可安装的 Agent Skill。
  - id: awesome-creative-recipes
    repo: Serennity007/awesome-creative-skills
    ref: main
    kind: resources
    base: skills
    target: resources/creative-recipes
    sparse: [skills]
    category: 视觉参考配方
    license: MIT

# A local, identity-preserving portrait relighting method and its Python checkers.
  - id: xxg-portrait-light
    repo: moskoo/xxg-portrait-rebuild-light
    ref: main
    kind: root
    target: xxg-portrait-rebuild-light
    sparse: [references, scripts, agents, assets]
    include: [SKILL.md, LICENSE, README.md, README.zh-CN.md, README.ja.md, README.ko.md, CONTRIBUTING.md, CHANGELOG.md, requirements.txt, references, scripts, agents]
    link_rewrites:
      '(/assets/': '(https://raw.githubusercontent.com/moskoo/xxg-portrait-rebuild-light/main/assets/'
    preview_items:
      - path: assets/skill-demo1.jpg
        target: xxg-portrait-rebuild-light.jpg
    category: 人像光影
    license: MIT
    notes: 需要实际图像编辑后端；方法论和检测脚本本身不负责生成图片。

  # Upstream Skill lives in skills/portrait-light; its docs live at repository root.
  - id: ai-portrait-light
    repo: L-Trunks/ai-portrait-light
    ref: master
    kind: items
    target: portrait-light
    base: skills
    sparse: [skills, docs, assets]
    items:
      - path: skills/portrait-light
        target: portrait-light
    extras:
      - path: docs
        target: docs
    link_rewrites:
      '../../docs/': 'docs/'
      '../../assets/': 'https://raw.githubusercontent.com/L-Trunks/ai-portrait-light/master/assets/'
      '../assets/': 'https://raw.githubusercontent.com/L-Trunks/ai-portrait-light/master/assets/'
    preview_items:
      - path: assets/02-seaside-frontlight.jpg
        target: portrait-light.jpg
    category: 人像布光
    license: CC BY 4.0 documents/images (licensed examples 01-10) + MIT code
    notes: SKILL 与配方文档 CC BY 4.0，需署名；只镜像授权说明明确涵盖的首批图片中的一张作预览。其余示例图仍由上游托管，保留原始链接。

  # Upstream uses a non-standard filename for its otherwise valid SKILL frontmatter.
  - id: genai-portrait
    repo: grapeot/genai_portrait_skill
    ref: master
    kind: file
    path: skills/skill_genai_portrait.md
    target: genai-portrait
    sparse: [skills, src, scripts, docs, examples]
    extras:
      - path: README.md
        target: README.md
      - path: pyproject.toml
        target: pyproject.toml
      - path: src
        target: src
      - path: scripts
        target: scripts
      - path: docs
        target: docs
      - path: examples/README.md
        target: examples/README.md
      - path: examples/prompts
        target: examples/prompts
    link_rewrites:
      '(examples/assets/': '(https://raw.githubusercontent.com/grapeot/genai_portrait_skill/master/examples/assets/'
      '(assets/': '(https://raw.githubusercontent.com/grapeot/genai_portrait_skill/master/examples/assets/'
    preview_items:
      - path: examples/assets/synthetic_workflow_comparison.jpg
        target: genai-portrait.jpg
    category: 人像精修
    license: MIT
    notes: 通过标准 SKILL.md 安装，同时镜像 Python CLI 源码、依赖清单和合成示例。使用 OpenAI 或 Gemini 等服务需自行配置密钥及额度。
