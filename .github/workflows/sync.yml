name: Sync PhotoStyle Skills

on:
  push:
    branches: [main]
    paths:
      - "config/sources.yaml"
      - "catalog/overrides.yaml"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/sync.yml"
  schedule:
    # UTC 02:17 -> Beijing/Singapore 10:17
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: photostyle-skills-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download upstream Skills into local tracked files
        run: python tools/sync.py --all
      - name: Validate mirror and metadata
        run: python tools/validate.py
      - name: Regenerate README and Chinese style atlas
        run: python tools/generate_docs.py
      - name: Commit first import to main
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md config/upstream-lock.json catalog/skills.json catalog/styles.json docs/ LICENSES/ skills/ previews/ resources/
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): import photo skills and regenerate atlas"
            git push
          fi
      - name: Create update PR
        if: github.event_name != 'push'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sync-photo-skills
          delete-branch: true
          title: "chore(sync): synchronize upstream photo skills"
          commit-message: "chore(sync): synchronize upstream photo skills"
          body: |
            Automated upstream synchronization. Please review all prompt, script,
            asset, license and NOTICE changes before merging.
          add-paths: |
            skills/
            previews/
            resources/
            LICENSES/
            config/upstream-lock.json
            catalog/skills.json
            catalog/styles.json
            docs/STYLES.md
            docs/SOURCES.md
            README.md
